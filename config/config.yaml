# =====================================================================
#  MLCamera — единственный конфиг. Сохранён из панели/настроек 04.11.2026 23:34.
#  Все параметры можно менять во вкладке «Настройки» веб-панели
#  или в приложении scripts/settings.py (Tkinter).
# =====================================================================

people:
  names:
    Алексей: Алексей
    Ольга: Ольга
    Сергей: Сергей
    Аня: Аня
    Катя: Катя
  unknown_label: Незнакомец
cameras:
- name: Ноутбук (веб-камера)
  source: 0
  enabled: true
camera:
  width: 1280
  height: 720
  fps: 0
  backend: auto
  fallback_webcam: true
  night_enabled: true
  night_brightness_threshold: 60
  frame_averaging_night: true
  frame_averaging_count: 10
analysis:
  detect_every_n_frames: 3
  frame_scale: 0.5
  multi_resolution: true
  small_frame_scale: 0.4
  debug_delay: 0.0
motion:
  enabled: true
  threshold: 1000
  scale: 0.25
  force_interval_frames: 30
tracking:
  enabled: true
  min_frames_to_notify: 3
  max_disappeared: 20
  max_distance: 90
  entry_line_y: 0.5
  car_max_disappeared: 6
  car_max_distance: 120
objects:
  enabled: true
  max_disappeared: 20
  max_distance: 100
  animals:
    enabled: true
    classes:
    - dog
    - cat
    - bird
    conf_threshold: 0.35
    min_frames: 2
    cooldown_minutes: 30
  packages:
    enabled: true
    classes:
    - backpack
    - suitcase
    - handbag
    conf_threshold: 0.4
    min_frames: 3
    stationary_seconds: 45
    stationary_move_ratio: 0.15
    stationary_min_pixels: 8
    cooldown_minutes: 120
face:
  enabled: true
  providers:
  - DmlExecutionProvider
  - CUDAExecutionProvider
  - CPUExecutionProvider
  model_name: buffalo_s
  detection_size:
  - 640
  - 640
  similarity_threshold: 0.45
  min_det_score: 0.4
  mesh_every_n_frames: 4
  cooldown_minutes: 30
  notify_unknown: true
  save_unknown: true
  auto_capture_unknown: true
  auto_capture_dir: data/datasets/auto_unknown
car:
  enabled: true
  detect_classes:
  - car
  - truck
  - bus
  - motorcycle
  conf_threshold: 0.35
  color_enabled: true
  brand_enabled: true
  brand_tta: true
  brand_min_conf: 0.25
  plate_enabled: true
  plate_engine: tesseract
  plate_vote_frames: 5
  known_plates: null
  cooldown_minutes: 60
models:
  yolov8: data/models/yolov8n.pt
  pose: data/models/yolov8n-pose.pt
  brand_onnx: data/models/car_brand.onnx
  brand_labels: data/models/car_brand_labels.json
database:
  path: data/db/ml_camera.db
storage:
  events_dir: data/events
recording:
  enabled: false
  mode: events
  output_dir: data/videos
  seconds_before: 3
  seconds_after: 3
  rotate_seconds: 300
  fps: 60
  fourcc: mp4v
ui:
  preview_enabled: true
  window_title: MLCamera — {cam}
preview:
  fps: 60
  width: 960
  analysis_fps: 30
  analysis_width: 640
  face_mesh: true
  boxes: true
  mirror: true
  pose: true
  pose_fps: 30
  pose_conf: 0.35
web:
  enabled: true
  autostart: true
  open_browser: true
  host: 127.0.0.1
  port: 8088
  title: MLCamera — история событий
  token: ''
  control: true
  overlay: true
  face_mesh: true
  stream_fps: 60
  stream_quality: 70
notify:
  min_interval_seconds: 30
  telegram:
    enabled: true
    bot_token: PASTE_TELEGRAM_BOT_TOKEN
    chat_ids:
    - '111111111'
    - '222222222'
  delete_images_after_send: false
  push:
    enabled: true
    provider: ntfy
    server: https://ntfy.sh
    topic: my_camera_unique_secret_topic
digest:
  enabled: true
  time: 09:00
  hours: 24
logging:
  level: INFO
  file: data/logs/camera.log
