# =====================================================================
#  MLCamera — МОЩНАЯ ПК-ВЕРСИЯ (Windows 11, Ryzen 5 5600, RX 5700 XT)
#  Запуск:  python -m src.main --config config/config.pc.yaml
#  Доп. пакеты:  pip install -r requirements-pc.txt  (даёт easyocr)
# =====================================================================

people:
  names:
    Алексей: "Алексей"
    Ольга: "Ольга"
    Сергей: "Сергей"
    Аня: "Аня"
    Катя: "Катя"
  unknown_label: "Незнакомец"

cameras:
  - name: "Камера-1 (двор)"
    source: "rtsp://admin:password@192.168.1.100:554/stream1"
    enabled: true
  - name: "Камера-2 (ворота)"
    source: "rtsp://admin:password@192.168.1.101:554/stream1"
    enabled: false
  - name: "Камера-3 (задний двор)"
    source: "rtsp://admin:password@192.168.1.102:554/stream1"
    enabled: false

camera:
  width: 1280
  height: 720
  night_enabled: true
  night_brightness_threshold: 60
  frame_averaging_night: true
  frame_averaging_count: 3

analysis:
  # ПК мощный — анализируем почти каждый кадр, без уменьшения
  detect_every_n_frames: 1
  frame_scale: 1.0
  multi_resolution: true
  small_frame_scale: 0.5
  debug_delay: 0.0

motion:
  enabled: true
  threshold: 1500
  scale: 0.25
  force_interval_frames: 300

tracking:
  enabled: true
  min_frames_to_notify: 3
  max_disappeared: 20
  max_distance: 90
  entry_line_y: 0.5

face:
  enabled: true
  # Видеокарта AMD — работает через DirectML (onnxruntime-directml).
  # Провайдеры пробуются по очереди; если нет GPU — откатится на CPU.
  providers: ["DmlExecutionProvider", "CUDAExecutionProvider", "CPUExecutionProvider"]
  model_name: "buffalo_l"          # точная модель — ПК тянет
  detection_size: [640, 640]
  similarity_threshold: 0.45
  min_det_score: 0.4
  cooldown_minutes: 30
  notify_unknown: true
  save_unknown: true
  auto_capture_unknown: true
  auto_capture_dir: "data/datasets/auto_unknown"

car:
  enabled: true
  detect_classes: ["car", "truck", "bus", "motorbike"]
  conf_threshold: 0.35
  color_enabled: true
  brand_enabled: true            # включи после обучения scripts/train_brand_classifier.py
  plate_enabled: true
  plate_engine: "easyocr"        # точнее на ПК (поставится из requirements-pc.txt)
  plate_vote_frames: 5
  known_plates:
    # - "A123BC 777"
  cooldown_minutes: 60

models:
  yolov8: "data/models/yolov8m.pt"    # точнее, чем n — ПК потянет
  brand_onnx: "data/models/car_brand.onnx"
  brand_labels: "data/models/car_brand_labels.json"

database:
  path: "data/db/ml_camera.db"

storage:
  events_dir: "data/events"

recording:
  enabled: true                    # видео с камеры пишется в data/videos/<камера>/
  mode: "continuous"               # непрерывно; можно "events" — клипы вокруг событий
  output_dir: "data/videos"
  seconds_before: 3
  seconds_after: 3
  rotate_seconds: 300              # новый файл каждые 5 минут
  fps: 12
  fourcc: "mp4v"

ui:
  preview_enabled: true            # живое окно с рамками
  window_title: "MLCamera — {cam}"

notify:
  min_interval_seconds: 20
  telegram:
    enabled: true
    bot_token: "PASTE_TELEGRAM_BOT_TOKEN"
    chat_ids:
      - "111111111"
      - "222222222"
  delete_images_after_send: false   # на ПК фото можно не удалять
  push:
    enabled: true
    provider: "ntfy"
    server: "https://ntfy.sh"
    topic: "my_camera_unique_secret_topic"

digest:
  enabled: true
  time: "09:00"
  hours: 24

logging:
  level: "INFO"
  file: "data/logs/camera.log"