# =====================================================================
#  MLCamera — ЛЁГКАЯ СЕРВЕРНАЯ ВЕРСИЯ (VPS 300 ₽: 1-2 CPU / 1-2 ГБ RAM)
#  Запуск:  python -m src.main --config config/config.vps.yaml
#  Разворачивается через Docker:  docs/DEPLOYMENT.md
# =====================================================================

people:
  names:
    Алексей: "Алексей"
    Ольга: "Ольга"
    Сергей: "Сергей"
    Аня: "Аня"
    Катя: "Катя"
  unknown_label: "Незнакомец"

cameras:
  - name: "Камера-1 (двор)"
    source: "rtsp://admin:password@192.168.1.100:554/stream1"
    enabled: true
  - name: "Камера-2 (ворота)"
    source: "rtsp://admin:password@192.168.1.101:554/stream1"
    enabled: false
  - name: "Камера-3 (задний двор)"
    source: "rtsp://admin:password@192.168.1.102:554/stream1"
    enabled: false

camera:
  width: 1280
  height: 720
  night_enabled: true
  night_brightness_threshold: 60
  frame_averaging_night: true
  frame_averaging_count: 3

analysis:
  # Слабый CPU: реже анализ + уменьшение кадра + мультиразрешение
  detect_every_n_frames: 8
  frame_scale: 0.5
  multi_resolution: true
  small_frame_scale: 0.4
  debug_delay: 0.0

motion:
  # Детекция движения — главный эконом: анализ только при шевелении
  enabled: true
  threshold: 1500
  scale: 0.25
  force_interval_frames: 300

tracking:
  enabled: true
  min_frames_to_notify: 3
  max_disappeared: 20
  max_distance: 90
  entry_line_y: 0.5

face:
  enabled: true
  providers: ["CPUExecutionProvider"]
  model_name: "buffalo_s"
  detection_size: [640, 640]
  similarity_threshold: 0.45
  min_det_score: 0.4
  cooldown_minutes: 30
  notify_unknown: true
  save_unknown: true
  auto_capture_unknown: true
  auto_capture_dir: "data/datasets/auto_unknown"

car:
  enabled: true
  detect_classes: ["car", "truck", "bus", "motorcycle"]
  conf_threshold: 0.35
  color_enabled: true
  # На VPS марка считается 1 раз на машину (~0.3 с CPU). Можно включить:
  #   python scripts/download_car_brand_model.py
  brand_enabled: false
  brand_tta: false
  brand_min_conf: 0.25
  plate_enabled: true
  plate_engine: "tesseract"        # лёгкий OCR, уже в Docker-образе
  plate_vote_frames: 5
  known_plates:
    # - "A123BC 777"
  cooldown_minutes: 60

models:
  yolov8: "data/models/yolov8n.pt"
  brand_onnx: "data/models/car_brand.onnx"
  brand_labels: "data/models/car_brand_labels.json"

database:
  path: "data/db/ml_camera.db"

storage:
  events_dir: "data/events"

recording:
  enabled: false                   # на VPS БЕЗ видео (economя CPU/диск)
  mode: "events"
  output_dir: "data/videos"
  seconds_before: 3
  seconds_after: 3
  rotate_seconds: 300
  fps: 12
  fourcc: "mp4v"

ui:
  preview_enabled: false           # на сервере нет дисплея
  window_title: "MLCamera — {cam}"

notify:
  min_interval_seconds: 30
  telegram:
    enabled: true
    bot_token: "PASTE_TELEGRAM_BOT_TOKEN"
    chat_ids:
      - "111111111"
      - "222222222"
  delete_images_after_send: true   # на VPS фото удаляем после отправки
  push:
    enabled: true
    provider: "ntfy"
    server: "https://ntfy.sh"
    topic: "my_camera_unique_secret_topic"

digest:
  enabled: true
  time: "09:00"
  hours: 24

logging:
  level: "INFO"
  file: "data/logs/camera.log"